backend:
  name: git-gateway
  branch: main

media_folder: "static/img"
public_folder: "/img"

collections:
  - name: "tours"
    label: "Туры"
    folder: "content/tours"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Описание", name: "description", widget: "text"}
      - {label: "Изображение", name: "image", widget: "image"}
      - {label: "Категория", name: "category", widget: "select", options: ["hiking", "climbing", "skiing"]}
      - {label: "Дата", name: "date", widget: "datetime"}
  - name: "reviews"
    label: "Отзывы"
    folder: "content/reviews"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Автор", name: "author", widget: "string"}
      - {label: "Город", name: "city", widget: "string"}
      - {label: "Текст отзыва", name: "body", widget: "text"}
      - {label: "Дата", name: "date", widget: "datetime"}
